services:
  - type: web
    name: vaardig-met-ai
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vaardig-met-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
databases:
  - name: vaardig-met-ai-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: vaardig_met_ai
    postgresMajorVersion: "16"
